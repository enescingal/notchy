name: Notchy
options:
  bundleIdPrefix: com.notchy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Notchy:
    type: application
    platform: macOS
    sources:
      - path: Notchy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchy.app
        PRODUCT_NAME: Notchy
    info:
      path: Notchy/Info.plist
      properties:
        CFBundleName: Notchy
        CFBundleDisplayName: Notchy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSBluetoothAlwaysUsageDescription: Notchy, bağlanan kulaklıkların pil durumunu çentikte göstermek için Bluetooth'a erişir.
    scheme:
      testTargets:
        - NotchyTests
  NotchyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NotchyTests
    dependencies:
      - target: Notchy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchy.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Notchy.app/Contents/MacOS/Notchy
        BUNDLE_LOADER: $(TEST_HOST)
